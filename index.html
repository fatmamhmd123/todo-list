<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn JavaScript</title>
    <link rel="stylesheet" href="main.css" />
    <style>
      body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #f5f3ff;
}

.container {
  max-width: 500px;
  margin: 20px auto;
}

.form {
  background-color: #ffffff;
  border-radius: 8px;
  padding: 20px;
  display: flex;
  align-items: center;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
}

.input {
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  flex: 1;
  color: #333;
}

.input:focus {
  outline: none;
  border-color: #7c3aed;
}

.add {
  border: none;
  background-color: #7c3aed;
  color: white;
  padding: 10px 15px;
  border-radius: 6px;
  margin-left: 10px;
  cursor: pointer;
}

.add:hover {
  background-color: #6d28d9;
}

.tasks {
  background-color: #ffffff;
  margin-top: 20px;
  border-radius: 8px;
  padding: 20px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
}

.tasks .task {
  background-color: #fafafa;
  padding: 10px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.3s;
  cursor: pointer;
  border: 1px solid #e5e7eb;
}

.tasks .task:not(:last-child) {
  margin-bottom: 15px;
}

.tasks .task:hover {
  background-color: #f3f0ff;
  border-color: #c4b5fd;
}

.tasks .task.done {
  opacity: 0.5;
}

.tasks .task span {
  font-size: 14px;
  background-color: #059669;
  color: white;
  padding: 3px 7px;
  border-radius: 4px;
  cursor: pointer;
  transition: .3S;
}

.tasks .task span:hover {
  background-color: #dc2626;
}
   
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form">
        <input type="text" class="input" placeholder="write your task here! "/>
        <input type="submit" class="add" value="Add Task" />
      </div>
      <div class="tasks"></div>
    </div>
<script src="js/main.js "></script>
</body>
</html>
